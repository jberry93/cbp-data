[project]
name = "cbp-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jeffrey Berry", email = "jeffreyberry93@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "pyarrow>=25.0.1",
]

[project.scripts]
cbp-data = "cbp_data:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]
